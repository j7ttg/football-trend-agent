name: Football Trend Agent v7

on:
  workflow_dispatch:
  schedule:
    # All times UTC
    # 6AM ET  = 10:00 UTC --> morning brief (deep scrape)
    # 9AM ET  = 13:00 UTC --> scan
    # 12PM ET = 16:00 UTC --> scan
    # 3PM ET  = 19:00 UTC --> afternoon brief
    # 5PM ET  = 21:00 UTC --> scan
    # 7PM ET  = 23:00 UTC --> scan
    # 8PM ET  = 00:00 UTC --> night brief
    # 12AM ET = 04:00 UTC --> scan
    - cron: "0 10 * * *"   # 6AM ET  -- morning
    - cron: "0 13 * * *"   # 9AM ET  -- scan
    - cron: "0 16 * * *"   # 12PM ET -- scan
    - cron: "0 19 * * *"   # 3PM ET  -- afternoon
    - cron: "0 21 * * *"   # 5PM ET  -- scan
    - cron: "0 23 * * *"   # 7PM ET  -- scan
    - cron: "0 0  * * *"   # 8PM ET  -- night
    - cron: "0 4  * * *"   # 12AM ET -- scan
  workflow_dispatch:
    inputs:
      brief_type:
        description: "Brief type (morning / afternoon / night / scan)"
        required: false
        default: "morning"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Determine brief type
        id: brief
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRIEF="${{ github.event.inputs.brief_type }}"
          else
            HOUR=$(date -u +%H)
            case $HOUR in
              10) BRIEF="morning"   ;;
              19) BRIEF="afternoon" ;;
              00) BRIEF="night"     ;;
              *)  BRIEF="scan"      ;;
            esac
          fi
          echo "brief_type=$BRIEF" >> $GITHUB_OUTPUT
          echo "Running brief type: $BRIEF"

      - name: Run Football Trend Agent
        env:
          APIFY_TOKEN:    ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE:     ${{ steps.brief.outputs.brief_type }}
        run: python agent.py

      - name: Persist trend data to repo
        run: |
          git config user.name  "trend-bot"
          git config user.email "trend-bot@noreply.github.com"
          git add data.json trend_memory.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update trend data [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
