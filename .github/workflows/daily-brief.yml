name: Football Trend Agent

"on":
  schedule:
    - cron: '0 * * * *'
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      brief_type:
        description: 'Which brief to run'
        required: true
        default: 'scan'
        type: choice
        options:
          - morning
          - afternoon
          - night
          - scan

jobs:

  hourly-scan:
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' &&
      github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.brief_type == 'scan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test Apify API
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "Testing Apify API..."
          python3 -c "
import os, requests, json
tok = os.environ.get('APIFY_TOKEN','')
print('Token length:', len(tok), 'prefix:', tok[:8] if tok else 'EMPTY')
# Try a quick run with 1 result
resp = requests.post('https://api.apify.com/v2/acts/clockworks~tiktok-hashtag-scraper/runs',
  params={'token': tok}, json={'hashtags': ['footballtraining'], 'resultsPerPage': 1}, timeout=30)
print('Start HTTP:', resp.status_code)
data = resp.json()
print('Response keys:', list(data.keys()) if isinstance(data, dict) else 'not a dict')
if resp.ok:
    print('Run ID:', data.get('data',{}).get('id','?'))
    print('Status:', data.get('data',{}).get('status','?'))
else:
    print('Error body:', str(data)[:300])
"
      - name: Hourly Scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE: scan
        run: python agent.py
      - name: Commit updated data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== DEBUG ==="
          pwd
          ls -la data.json 2>/dev/null || echo "NO data.json found!"
          git config user.name "Football Trend Bot"
          git config user.email "bot@football-trend-agent"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/j7ttg/football-trend-agent.git
          git add data.json || true
          git status
          git diff --staged --quiet || git commit -m "Hourly scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "Push failed (may be nothing to push)"

  morning-brief:
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.brief_type == 'morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Morning Brief
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE: morning
        run: python agent.py
      - name: Commit updated data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Football Trend Bot"
          git config user.email "bot@football-trend-agent"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/j7ttg/football-trend-agent.git
          git add data.json || true
          git diff --staged --quiet || git commit -m "Morning brief $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true

  afternoon-brief:
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.brief_type == 'afternoon')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Afternoon Brief
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE: afternoon
        run: python agent.py
      - name: Commit updated data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Football Trend Bot"
          git config user.email "bot@football-trend-agent"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/j7ttg/football-trend-agent.git
          git add data.json || true
          git diff --staged --quiet || git commit -m "Afternoon brief $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true

  night-brief:
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.brief_type == 'night')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Night Brief
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE: night
        run: python agent.py
      - name: Commit updated data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Football Trend Bot"
          git config user.email "bot@football-trend-agent"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/j7ttg/football-trend-agent.git
          git add data.json || true
          git diff --staged --quiet || git commit -m "Night brief $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
