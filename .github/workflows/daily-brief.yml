name: Football Trend Agent v5

on:
  schedule:
    # Runs every 3 hours (8x per day) -- all times UTC
    # 6AM ET  = 10:00 UTC  --> morning brief
    # 9AM ET  = 13:00 UTC  --> scan
    # 12PM ET = 16:00 UTC  --> scan
    # 2PM ET  = 18:00 UTC  --> afternoon brief
    # 5PM ET  = 21:00 UTC  --> scan
    # 7PM ET  = 23:00 UTC  --> scan
    # 9PM ET  = 01:00 UTC  --> night brief
    # 12AM ET = 04:00 UTC  --> scan
    - cron: "0 10 * * *"   # 6AM ET  -- morning
    - cron: "0 13 * * *"   # 9AM ET  -- scan
    - cron: "0 16 * * *"   # 12PM ET -- scan
    - cron: "0 18 * * *"   # 2PM ET  -- afternoon
    - cron: "0 21 * * *"   # 5PM ET  -- scan
    - cron: "0 23 * * *"   # 7PM ET  -- scan
    - cron: "0 1 * * *"    # 9PM ET  -- night
    - cron: "0 4 * * *"    # 12AM ET -- scan
  workflow_dispatch:
    inputs:
      brief_type:
        description: "Brief type (morning / afternoon / night / scan)"
        required: false
        default: "morning"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Determine brief type
        id: brief
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRIEF="${{ github.event.inputs.brief_type }}"
          else
            HOUR=$(date -u +%H)
            case $HOUR in
              10) BRIEF="morning" ;;
              18) BRIEF="afternoon" ;;
              01) BRIEF="night" ;;
              *)  BRIEF="scan" ;;
            esac
          fi
          echo "brief_type=$BRIEF" >> $GITHUB_OUTPUT
          echo "Running brief type: $BRIEF"

      - name: Run Football Trend Agent
        env:
          APIFY_TOKEN:    ${{ secrets.APIFY_TOKEN }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          BRIEF_TYPE:     ${{ steps.brief.outputs.brief_type }}
        run: python agent.py
